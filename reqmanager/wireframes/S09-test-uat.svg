idth="1"/><text x="1480.0" y="44.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#F97316">S09</text><text x="1480.0" y="72.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#1D2939">測試與驗收</text><g id="Annotation/1"><circle cx="1491" cy="114" r="11" fill="#F97316"/><text x="1491.0" y="118.5" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><text x="1512.0" y="115.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">QA 每個案例記錄結果與證據；任一失敗必須關聯缺</text><text x="1512.0" y="135.2" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">陷，送出後需求回到「開發中」，前次紀錄保留不覆</text><text x="1512.0" y="155.3" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">寫（AC-05A）。</text><g id="Annotation/2"><circle cx="1491" cy="190.45" r="11" fill="#F97316"/><text x="1491.0" y="194.9" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><text x="1512.0" y="191.4" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">只有被指定的業務驗收者看得到此面板（AC-05B）。</text><text x="1512.0" y="211.6" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">檢查清單直接來自 S08-B 填寫的驗收條件。</text><g id="Annotation/3"><circle cx="1491" cy="246.75" r="11" fill="#F97316"/><text x="1491.0" y="251.2" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><text x="1512.0" y="247.8" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">結案檢查清單三項齊全才能結案；缺項以紅字指出（</text><text x="1512.0" y="267.9" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">AC-05C）。結案後通知提出人、工程、QA。</text><g id="Annotation/4"><circle cx="1491" cy="303.05" r="11" fill="#F97316"/><text x="1491.0" y="307.6" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text></g><text x="1512.0" y="304.1" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">已結案的需求在「⋯」選單提供「重新開啟」，必填</text><text x="1512.0" y="324.2" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">原因並保留原結案紀錄（AC-05D）。</text></g></g></svg>