t-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">技術初估（選填）</text><rect x="384.0" y="492.0" width="288.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="396.0" y="515.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">約 3 人天</text><text x="384.0" y="546.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="400" fill="#667085">由技術負責人提供</text></g><g id="Field/評估說明"><text x="88.0" y="574.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">評估說明</text><text x="144.0" y="574.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="600" fill="#D92D20">*</text><rect x="88.0" y="582.0" width="584.0" height="90.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="100.0" y="605.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">影響 3 家 B2B 客戶，財務對帳退件頻繁；改動範圍小。</text></g><rect x="88.0" y="690.0" width="584.0" height="60.0" fill="#F5F6F8" rx="8"/><text x="104.0" y="716.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">接受後狀態變為「待排程」，會通知提出人王小明。</text><text x="104.0" y="736.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#667085">接受不代表立即開發，開發前仍需指派負責人與承諾日期。</text><g id="Button/確認接受"><rect x="564.0" y="796.0" width="108.0" height="36.0" fill="#2F6FED" rx="6"/><text x="618.0" y="819.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">確認接受</text></g><g id="Button/取消"><rect x="480.0" y="796.0" width="72.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="516.0" y="819.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="500" fill="#1D2939" text-anchor="middle">取消</text></g></g><g id="Modal/B_指派開發"><rect x="740.0" y="80.0" width="640.0" height="780.0" fill="#FFFFFF" rx="12"/><text x="768.0" y="122.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#2F6FED">S08-B</text><text x="768.0" y="150.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#1D2939">開始開發</text><text x="768.0" y="174.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#667085">狀態：待排程 → 開發中</text><g id="Field/開發負責人"><text x="768.0" y="214.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">開發負責人</text><text x="837.0" y="214.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="600" fill="#D92D20">*</text><rect x="768.0" y="222.0" width="280.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="780.0" y="245.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">張家豪</text><polyline points="1026.0,237.0 1032.0,243.0 1038.0,237.0" fill="none" stroke="#667085" stroke-width="1.5" stroke-linejoin="round"/></g><g id="Field/承諾日期"><text x="1064.0" y="214.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">承諾日期</text><text x="1120.0" y="214.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="600" fill="#D92D20">*</text><rect x="1064.0" y="222.0" width="288.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="1076.0" y="245.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">2026/10/24</text><rect x="1324.0" y="232.0" width="16.0" height="16.0" fill="none" rx="2" stroke="#667085" stroke-width="1.2"/><line x1="1324" y1="237.0" x2="1340" y2="237.0" stroke="#667085" stroke-width="1.2"/><text x="1064.0" y="276.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="400" fill="#667085">已與技術負責人確認</text></g><g id="Annotation/2"><circle cx="1350" cy="208" r="11" fill="#F97316"/><text x="1350.0" y="212.5" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><text x="768.0" y="310.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">驗收條件（AC）</text><text x="865.1" y="310.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="600" fill="#D92D20">*</text><rect x="768.0" y="324.0" width="584.0" height="150.0" fill="#FFFFFF" rx="6" stroke="#D92D20" stroke-width="1.5"/><text x="784.0" y="352.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">1. 匯出報價單含「稅別」欄</text><text x="784.0" y="380.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">2. </text><text x="804.0" y="380.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#98A2B3">輸入下一條…</text><text x="768.0" y="494.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="400" fill="#D92D20">至少需要 2 條可驗證的驗收條件</text><g id="Field/業務驗收者"><text x="768.0" y="534.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="500" fill="#1D2939">業務驗收者</text><text x="837.0" y="534.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="600" fill="#D92D20">*</text><rect x="768.0" y="542.0" width="280.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="780.0" y="565.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">王小明</text><polyline points="1026.0,557.0 1032.0,563.0 1038.0,557.0" fill="none" stroke="#667085" stroke-width="1.5" stroke-linejoin="round"/><text x="768.0" y="596.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="400" fill="#667085">預設為提出人，可改派</text></g><rect x="1064.0" y="554.0" width="16.0" height="16.0" fill="#2F6FED" rx="3"/><polyline points="1068.0,562.0 1071.0,565.0 1076.0,559.0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/><text x="1088.0" y="567.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="400" fill="#1D2939">技術負責人已確認可行性</text><rect x="768.0" y="640.0" width="584.0" height="86.0" fill="#FEF0C7" rx="8"/><text x="784.0" y="668.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="600" fill="#B54708">尚缺：驗收條件</text><text x="784.0" y="692.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#B54708">開發負責人、承諾日期、驗收條件、技術確認四項齊全才能開始開發</text><text x="784.0" y="712.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#B54708">（PRD AC-03C）</text><g id="Annotation/3"><circle cx="1350" cy="648" r="11" fill="#F97316"/><text x="1350.0" y="652.5" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><g id="Button/開始開發"><rect x="1244.0" y="796.0" width="108.0" height="36.0" fill="#E4E7EC" rx="6"/><text x="1298.0" y="819.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="500" fill="#98A2B3" text-anchor="middle">開始開發</text></g><g id="Button/取消"><rect x="1160.0" y="796.0" width="72.0" height="36.0" fill="#FFFFFF" rx="6" stroke="#D0D5DD" stroke-width="1"/><text x="1196.0" y="819.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="14" font-weight="500" fill="#1D2939" text-anchor="middle">取消</text></g></g></g><g id="Notes"><rect x="1440.0" y="0.0" width="400.0" height="900.0" fill="#FFFFFF"/><line x1="1440" y1="0" x2="1440" y2="900" stroke="#D0D5DD" stroke-width="1"/><text x="1480.0" y="44.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#F97316">S08</text><text x="1480.0" y="72.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#1D2939">評估與指派</text><g id="Annotation/1"><circle cx="1491" cy="114" r="11" fill="#F97316"/><text x="1491.0" y="118.5" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><text x="1512.0" y="115.0" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">計分為排序參考，不自動決定優先級。說明為必填，</text><text x="1512.0" y="135.2" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">會寫入評估紀錄供日後追溯（PRD FR-03）。</text><g id="Annotation/2"><circle cx="1491" cy="170.3" r="11" fill="#F97316"/><text x="1491.0" y="174.8" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><text x="1512.0" y="171.3" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">承諾日期變更時另開對話框，必填變更原因並通知提</text><text x="1512.0" y="191.5" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">出人（AC-03D）。</text><g id="Annotation/3"><circle cx="1491" cy="226.60000000000002" r="11" fill="#F97316"/><text x="1491.0" y="231.1" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><text x="1512.0" y="227.6" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">條件不齊全時主要按鈕停用，並在按鈕上方明確列出</text><text x="1512.0" y="247.8" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">「尚缺」哪些項目，不只是反灰。後端也須再檢查一</text><text x="1512.0" y="267.9" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">次。</text><g id="Annotation/4"><circle cx="1491" cy="303.05" r="11" fill="#F97316"/><text x="1491.0" y="307.6" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text></g><text x="1512.0" y="304.1" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">「要求補件」與「不採納」使用同一個精簡對話框：</text><text x="1512.0" y="324.2" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">只有必填原因欄位＋確認按鈕，送出後通知提出人（</text><text x="1512.0" y="344.4" font-family="Noto Sans TC, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="400" fill="#1D2939">AC-03A）。</text></g></g></svg>